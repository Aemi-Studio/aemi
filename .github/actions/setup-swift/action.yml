name: "Setup Swift 6.4 (macOS)"
description: >-
  Installs a pinned Swift 6.4 toolchain on macOS and exports TOOLCHAINS. The default is the
  6.4.0 release; a swift-6.4.x-branch dated snapshot is still accepted. Select an Xcode SDK
  before invoking this action. The toolchain is pinned so updates can be reviewed and verified
  alongside the Linux toolchain pin.
inputs:
  toolchain:
    description: >-
      swift.org toolchain name: a release (swift-6.4.0-RELEASE) or a swift-6.4.x-branch
      snapshot (swift-6.4.x-DEVELOPMENT-SNAPSHOT-YYYY-MM-DD-a).
    required: false
    default: "swift-6.4.0-RELEASE"
  snapshot:
    description: "Deprecated alias for `toolchain`; wins over it when set."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install the toolchain and export TOOLCHAINS
      shell: bash
      env:
        TOOLCHAIN_INPUT: ${{ inputs.toolchain }}
        SNAPSHOT_INPUT: ${{ inputs.snapshot }}
      run: |
        set -euo pipefail
        NAME="${SNAPSHOT_INPUT:-$TOOLCHAIN_INPUT}"
        if [[ "$NAME" =~ ^swift-(6\.4\.[0-9]+)-RELEASE$ ]]; then
          URL="https://download.swift.org/swift-${BASH_REMATCH[1]}-release/xcode/${NAME}/${NAME}-osx.pkg"
        elif [[ "$NAME" =~ ^swift-6\.4\.x-DEVELOPMENT-SNAPSHOT-[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z]$ ]]; then
          URL="https://download.swift.org/swift-6.4.x-branch/xcode/${NAME}/${NAME}-osx.pkg"
        else
          echo "Invalid toolchain name: ${NAME}" >&2; exit 1
        fi
        TC_DIR="/Library/Developer/Toolchains/${NAME}.xctoolchain"
        if [ ! -d "$TC_DIR" ]; then
          echo "Downloading ${NAME}-osx.pkg …"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${NAME}-osx.pkg" "$URL"
          sudo installer -pkg "${RUNNER_TEMP}/${NAME}-osx.pkg" -target /
          rm -f "${RUNNER_TEMP}/${NAME}-osx.pkg"
        fi
        TOOLCHAIN_ID="$(plutil -extract CFBundleIdentifier raw "${TC_DIR}/Info.plist")"
        echo "TOOLCHAINS=${TOOLCHAIN_ID}" >> "$GITHUB_ENV"
        echo "Installed toolchain: ${TOOLCHAIN_ID}"
        TOOLCHAINS="${TOOLCHAIN_ID}" swift --version
