name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aemi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Match the shared workflow budget for compiler timing on hosted runners.
  AEMI_TYPECHECK_BUDGET_MS: "250"

jobs:
  test:
    name: Swift ${{ matrix.swift }} (${{ matrix.configuration }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.3.3', '6.4.1']
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the stable SDK
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install Swift ${{ matrix.swift }}
        uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3.0.0-beta.1
        with:
          swift-version: ${{ matrix.swift }}
      - run: swift --version
      - name: Restore the SwiftPM tree
        id: spm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ matrix.swift }}-${{ matrix.configuration }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-${{ matrix.swift }}-${{ matrix.configuration }}-
      - name: Resolve remote dependencies
        run: swift package resolve
      - name: Build
        run: swift build -c '${{ matrix.configuration }}'
      - name: Test
        # Swift 6.3's `swift test` runs every test module in ONE process, so ~30 stress tests (200-500
        # iterations each) share a 3-CPU runner's cooperative pool and starve real-time waits: one of them
        # (ThreadGateTests) timed out on every parallel 6.3 run, while each module alone and the whole
        # suite with --no-parallel passed (debug and release). 6.4 runs each module separately and passes
        # in parallel, so only 6.3 is serialized; it costs ~10-15 s.
        run: swift test -c '${{ matrix.configuration }}' ${{ startsWith(matrix.swift, '6.3') && '--no-parallel' || '' }}
      - name: Save the SwiftPM tree
        if: ${{ always() && github.ref == 'refs/heads/main' && steps.spm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ matrix.swift }}-${{ matrix.configuration }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

  unicode-tables:
    # The categories, scripts and folding orbits are generated from Go's unicode package (aemi ADR 0018; moved from AemiRegex): the
    # table in the repository must be what the generator writes. The binary-property table comes from node's RegExp and is not
    # regenerated here: a newer node carries a newer Unicode, and that table moves with the Go one, by hand, when Go moves.
    name: Unicode tables are regenerable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Regenerate and compare
        run: |
          go run scripts/unicode/gen.go > /tmp/UnicodeDataTables.swift
          diff -u Sources/AemiUnicode/Generated/UnicodeDataTables.swift /tmp/UnicodeDataTables.swift

  c-kernels:
    # The C kernels against their scalar references with AddressSanitizer and UndefinedBehaviorSanitizer: every fold and scan variant,
    # and the pair-set (Teddy) kernel on arm64 and, under Rosetta, its x86-64 SSSE3 path. The Swift tests run only the host's own
    # backend. AVX2 and AVX-512 run nowhere yet: Rosetta reports SSE4.2 at most (docs/research/c-kernels-and-rust-2026-10.md).
    name: C kernels, differential under sanitizers
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rosetta, for the x86-64 path
        run: sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Fold and scan kernels
        run: scripts/bench-c-kernels.sh --check
      - name: Pair-set kernel
        run: scripts/pair-set-check.sh
      - name: CRC-32C, bit count and UTF-16 kernels (ADR 0020)
        run: scripts/checksum-kernels-check.sh

  result:
    name: ci result
    needs: [test, unicode-tables, c-kernels]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}' > needs.json
          if grep -E '"result": "(failure|cancelled)"' needs.json; then exit 1; fi
